name: Deploy landing page

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# id-token is what lets this job mint a short-lived Google credential via
# Workload Identity Federation. No service-account key is stored anywhere:
# GCP blocks key creation on this project by org policy, and WIF is the
# better answer anyway.
permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  FIREBASE_PROJECT: project-96b6d773-106a-457a-a46

  # The Firebase web config, the same values as .env.example. It is public by
  # design — it names the project, it authorizes nothing; access is enforced by
  # Firebase Auth itself — which is why it sits here in plain sight rather than
  # in a secret.
  #
  # It has to be present at BUILD time, not just at run time: NEXT_PUBLIC_* is
  # inlined into the bundle by next build, and src/lib/firebase.ts calls
  # getAuth() at module scope. Without these, prerendering / evaluates that
  # module with apiKey: undefined and the build dies on auth/invalid-api-key.
  NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDahF4NfGaibY8r8TFchHls7-XGJ5FvP8Y
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: project-96b6d773-106a-457a-a46.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: project-96b6d773-106a-457a-a46
  NEXT_PUBLIC_FIREBASE_APP_ID: "1:349500970232:web:65ca0b1ba5cc4c1b3bd70d"
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "349500970232"
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: project-96b6d773-106a-457a-a46.firebasestorage.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # firebase deploy builds the app again itself (hosting.source points at
      # this directory). This step is kept anyway so a broken build fails in
      # forty seconds, with next's own error, before the job touches GCP.
      - run: npm run build

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/349500970232/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions-deploy@project-96b6d773-106a-457a-a46.iam.gserviceaccount.com

      # Framework-aware Hosting is still behind an opt-in flag. Without this the
      # deploy steps read hosting.source as a config error rather than as
      # "build this Next.js app and put its server somewhere".
      - name: Enable framework-aware hosting
        run: npx --yes firebase-tools@15 experiments:enable webframeworks

      # Without this, both deploy steps below exit 1 AFTER succeeding.
      # firebase-tools wants an Artifact Registry cleanup policy so the SSR
      # container images do not accumulate and bill; it cannot ask under
      # --non-interactive, and it reports not being able to ask as an error
      # rather than skipping it. Setting the policy answers the question
      # instead of suppressing it.
      #
      # A step of its own because hosting:channel:deploy accepts no flag that
      # would answer the prompt inline, so the preview path could not do this
      # for itself even in principle. Re-running it is a no-op.
      - name: Ensure an image cleanup policy exists
        run: |
          npx --yes firebase-tools@15 functions:artifacts:setpolicy \
            --project "$FIREBASE_PROJECT" --location us-east1 --days 3 --force

      # Pull requests get a throwaway preview URL that expires in 7 days.
      - name: Deploy preview
        if: github.event_name == 'pull_request'
        run: |
          npx --yes firebase-tools@15 hosting:channel:deploy "pr-${{ github.event.number }}" \
            --project "$FIREBASE_PROJECT" --expires 7d --non-interactive

      # Pushes to main go straight to the live site.
      - name: Deploy live
        if: github.event_name != 'pull_request'
        run: |
          npx --yes firebase-tools@15 deploy --only hosting \
            --project "$FIREBASE_PROJECT" --non-interactive
